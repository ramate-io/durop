name: "Bug"
description: "Report a reproducible defect."
title: ""
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Follow the planning standard in docs/planning.md. A maintainer applies the chosen priority label during triage."
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "priority:low"
        - "priority:medium"
        - "priority:high"
        - "priority:urgent"
      default: 1
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "State the expected behavior and the actual behavior."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Reproduction"
      description: "Include version/commit, platform, steps and relevant sanitized logs."
    validations:
      required: true
  - type: textarea
    id: candidate
    attributes:
      label: "Release candidate"
      description: "Link the candidate issue, or explain the pending scheduling decision."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Regression check"
      description: "Describe how to verify the fix and prevent recurrence."
    validations:
      required: true
