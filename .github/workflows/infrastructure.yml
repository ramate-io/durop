name: Tailscale infrastructure checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Bindings, tests, synthesis and schema (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Validate locked bindings, infrastructure tests and synthesized schema
        run: |
          nix develop .#infrastructure --command bash -euc '
            python infra/manage.py setup durop-network --no-env
            git diff --exit-code -- infra/cdktn/tailscale/imports infra/cdktn/tailscale/.terraform.lock.hcl
            python -m unittest discover -s scripts/tests -v
            uv --directory infra/cdktn/tailscale run --locked --no-sync python -m unittest discover -s tests -v
            python infra/manage.py synth durop-network --no-env --config infra/cdktn/tailscale/network.config.example.json
            python infra/manage.py validate durop-network --no-env --config infra/cdktn/tailscale/network.config.example.json
            tailscale version
          '
