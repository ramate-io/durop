name: Tailscale infrastructure checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Bindings, tests, synthesis and schema (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - name: Validate locked bindings, infrastructure tests and synthesized schema
        run: |
          nix develop --command bash -euc '
            python -m unittest discover -s scripts/tests -v
            cd infra/cdktn/tailscale
            uv sync --locked
            uv run --locked --no-sync python main.py setup --no-env
            git diff --exit-code -- imports .terraform.lock.hcl
            uv run --locked --no-sync python -m unittest discover -s tests -v
            uv run --locked --no-sync python main.py synth --no-env --config network.config.example.json
            uv run --locked --no-sync python main.py validate --no-env --config network.config.example.json
            tailscale version
          '
