name: Issue label definitions

on:
  push:
    branches: [main]
    paths: ['.github/labels.json', '.github/workflows/labels.yml']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    name: Create or update planning and priority labels
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synchronize declared labels without deleting other labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const labels = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo, per_page: 100
            });
            const names = new Set(existing.map(label => label.name));
            for (const label of labels) {
              if (names.has(label.name)) {
                await github.rest.issues.updateLabel({ ...context.repo, ...label });
              } else {
                await github.rest.issues.createLabel({ ...context.repo, ...label });
              }
            }
