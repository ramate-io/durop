name: Native macOS package
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'sample-packs/**'
      - 'fixtures/media/**'
      - 'packaging/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/package.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned native Rust
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup target add --toolchain "$channel" aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-macos-arm64-14-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Test recursive loader validator
        run: python3 -m unittest discover -s packaging/macos -p 'test_*.py' -v
      - name: Build, bundle, sign and self-check
        run: packaging/macos/package.sh --output dist/ci-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: Durop-macos-arm64-${{ github.sha }}
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/ci-${{ github.sha }}/*.zip
            dist/ci-${{ github.sha }}/*.sha256
            dist/ci-${{ github.sha }}/BUILD-INFO.json
            dist/ci-${{ github.sha }}/VALIDATION.json
