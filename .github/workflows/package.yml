name: Package

# Native Apple Silicon DMG. Published GitHub releases attach the image using
# the tag (without a leading v) so v0.1.0-playtest-001 becomes
# Durop-0.1.0-playtest-001-macos-arm64.dmg. Push is branch-only so creating a
# tag does not start a second run that shares a ref with `release` and cancels
# the upload.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'crates/**'
      - 'assets/**'
      - 'sample-packs/**'
      - 'fixtures/media/**'
      - 'packaging/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/package.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'crates/**'
      - 'assets/**'
      - 'sample-packs/**'
      - 'fixtures/media/**'
      - 'packaging/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/package.yml'
  release:
    types: [published]

concurrency:
  group: package-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

jobs:
  macos:
    name: Build, sign and validate DMG (macOS 15 arm64; target 14+)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned native Rust
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          rustup target add --toolchain "$channel" aarch64-apple-darwin
          native_cargo=$(rustup which --toolchain "$channel" cargo)
          printf 'DUROP_NATIVE_CARGO=%s\n' "$native_cargo" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-macos-arm64-15-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Resolve artifact version
        run: |
          version="$(packaging/macos/package.sh --print-version)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test packaging helpers and recursive Mach-O dependency validator
        run: python3 -m unittest discover -s packaging/macos -p 'test_*.py' -v
      - name: Build app and DMG, then validate signature, dependencies and bundled resources
        run: packaging/macos/package.sh --output dist/ci-${{ github.sha }}
      - name: Upload DMG, checksum and validation reports
        uses: actions/upload-artifact@v4
        with:
          name: durop-${{ env.VERSION }}-macos-arm64
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/ci-${{ github.sha }}/*.dmg
            dist/ci-${{ github.sha }}/*.sha256
            dist/ci-${{ github.sha }}/BUILD-INFO.json
            dist/ci-${{ github.sha }}/VALIDATION.json

  publish-release:
    if: github.event_name == 'release'
    needs: [macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: durop-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.event.release.tag_name }}" artifacts/*.dmg artifacts/*.sha256 --clobber
