name: Application checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Rust format, check, tests, Clippy and build (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'flake.lock', 'flake.nix') }}
      - name: Check Rust formatting
        run: nix develop --command cargo fmt --all -- --check
      - name: Type-check with locked dependencies
        run: nix develop --command cargo check --locked
      - name: Run Rust unit and integration tests
        run: nix develop --command cargo test --locked
      - name: Lint all Rust targets with warnings denied
        run: nix develop --command cargo clippy --all-targets --locked -- -D warnings
      - name: Build the application with locked dependencies
        run: nix develop --command cargo build --locked
