name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'flake.lock', 'flake.nix') }}
      - run: nix develop --command cargo fmt --all -- --check
      - run: nix develop --command cargo check --locked
      - run: nix develop --command cargo test --locked
      - run: nix develop --command cargo clippy --all-targets --locked -- -D warnings
      - run: nix develop --command cargo build --locked
