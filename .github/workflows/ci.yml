name: Application checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Rust workspace tests, lint, docs and build (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'flake.lock', 'flake.nix') }}
      - name: Check Rust formatting
        run: nix develop --command cargo fmt --all -- --check
      - name: Type-check with locked dependencies
        run: nix develop --command cargo check --workspace --locked
      - name: Compile Rust unit and integration test executables
        timeout-minutes: 20
        run: nix develop --command cargo test --workspace --locked --no-run
      - name: Run Rust unit and integration tests
        timeout-minutes: 5
        run: nix develop --command cargo test --workspace --locked
      - name: Verify bundled reaction media hashes and provenance
        run: python3 sample-packs/reactions/pack_tool.py verify --metadata-only
      - name: Lint all Rust targets with warnings denied
        run: nix develop --command cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Validate workspace API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: nix develop --command cargo doc --workspace --no-deps --locked
      - name: Build every workspace member with locked dependencies
        run: nix develop --command cargo build --workspace --locked
