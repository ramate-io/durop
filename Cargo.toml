[workspace]
resolver = "3"
members = [".", "crates/*"]
default-members = ["."]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
durop-protocol = { path = "crates/durop-protocol" }
durop-catalog = { path = "crates/durop-catalog" }
durop-host = { path = "crates/durop-host" }
durop-media = { path = "crates/durop-media" }
durop-transport = { path = "crates/durop-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }

[package]
name = "durop"
default-run = "durop"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[dependencies]
durop-protocol.workspace = true
durop-catalog.workspace = true
durop-host.workspace = true
durop-media.workspace = true
durop-transport.workspace = true
bevy = { version = "0.20", default-features = false, features = ["std", "async_executor", "bevy_window", "bevy_winit", "x11", "bevy_asset", "bevy_render", "bevy_camera", "bevy_core_pipeline", "bevy_sprite", "bevy_sprite_render", "bevy_text", "default_font", "png", "bevy_ui", "bevy_ui_render", "bevy_ui_widgets", "bevy_picking", "ui_picking", "system_clipboard"] }

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "registry"] }
winit = { version = "=0.30.13", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
raw-window-handle = "0.6"
objc2-foundation = "0.3.2"

[dev-dependencies]
durop-transport = { workspace = true, features = ["test-support"] }
