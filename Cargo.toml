[package]
name = "durop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["std", "async_executor", "bevy_window", "bevy_winit", "x11"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
tokio-tungstenite = "0.28"
futures-util = { version = "0.3.34", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4.3"
if-addrs = "0.14"
subtle = "2.6"
sha2 = "0.10"
